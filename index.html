<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="index.js"></script>
    <title>Számológép</title>
</head>
<body>
    <main>
        <h1>Számológép</h1>
        <input type="text" id="kiirato">
        <div id="gombok">
            <button class="szam" id="nulla">0</button>
            <button class="szam" id="egy">1</button>
            <button class="szam" id="ketto">2</button>
            <button class="szam" id="harom">3</button>
            <button class="fos" id="osszeadas">+</button>
            
            <button class="szam" id="negy">4</button>
            <button class="szam" id="ot">5</button>
            <button class="szam" id="hat">6</button>
            <button class="fos" id="kivonas">-</button>

            <button class="szam" id="het">7</button>
            <button class="szam" id="nyolc">8</button>
            <button class="szam" id="kilenc">9</button>
            <button class="fos" id="szorzas">*</button>

            <button id ="torles" id="torles">C</button>
            <button id ="egyenlo" id="egyenlo">=</button>
            <button class="fos" id="osztas">/</button>
        </div>
    </main>
</body>
</html>
